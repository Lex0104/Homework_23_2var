{% extends 'catalog/base.html' %}
{% load my_tags %}

{% block title %}Удаление продукта{% endblock %}

{% block content %}
<div class="row text-center">
  <h1>Вы действительно хотите удалить продукт "{{ object.title }}"?</h1>
</div>
<div class="container">
  <form method="post" action="" class="form-floating" enctype="multipart/form-data">
    <div class="row col-3">
        <form method="post" action="" class="form-floating" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="px-3 mb-1">
              <button type="submit" class="btn btn-danger">Удалить</button>
              <a class="link" href="/">
                <button type="button" class="btn btn-success">Отмена</button>
              </a>
            </div>
        </form>
      </div>
  </form>
</div>
{% endblock %}
