{% extends 'catalog/base.html' %}

{% block title %}Новая категория{% endblock %}

{% block content %}
<div class="row text-center">
  <h1>Новая категория</h1>
</div>
<div class="container">
  <form method="post" action="" class="form-floating">
    {% csrf_token %}
    <div class="row">
      <div class="col-6">
        <form method="post" action="" class="form-floating">
          <div class="card">
            <div class="card-body">
              {% csrf_token %}
              {{ form.as_p }}
            </div>
            <div class="px-3 mb-1">
              <button type="submit" class="btn btn-success">Добавить категорию</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </form>
</div>
{% endblock %}
