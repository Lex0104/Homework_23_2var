{% extends 'catalog/base.html' %}
{% load static %}

{% block title %}{{ object.title }}{% endblock %}

{% block content %}
<div class="container">
    <div class="row d-flex justify-content-center">
        <div class="col-6">
            <div class="card">
                <div class="card-header">
                    <h4>{{ object.title }}</h4>
                </div>
                <div class="card-body">
                    <p>{{ object.content }}</p>
                    <p> <img src="{{ media.blog.блог1.jpg }}" style="width: 500px" alt="{{ blog.title }}"></p>
                    <a class="p-2 btn btn-primary" href="/blogs/">Назад</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
